[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphpi"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["openai>=1.50,<3"]

[project.optional-dependencies]
benchmark-native = [
    "langchain>=0.3,<0.4", "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.2,<0.4", "aiofiles>=23", "faiss-cpu>=1.7",
    "networkx>=3", "numpy>=1.24", "PyYAML>=6", "tqdm>=4.66",
]

[project.scripts]
graphpi = "graphpi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
